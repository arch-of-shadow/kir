[package]
name = "kir-macros"
edition.workspace = true
version = "0.1.2"
authors = ["Kexing Zhou", "Youwei Xiao", "Zizhang Luo"]
readme = "../README.md"
repository = "https://github.com/arch-of-shadow/kir"
license = "MIT OR Apache-2.0"
keywords = ["IR", "SSA", "parser", "printer"]
categories = ["compilers", "parsing"]
description = "The macros for kir."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.86"
proc-macro-error = "1.0"
quote = "1.0.36"
syn = { version = "2.0.74", features = ["full", "extra-traits"] }
